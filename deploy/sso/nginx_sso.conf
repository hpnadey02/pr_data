# nginx in front of the chatbot when AUTH_MODE=sso. Adapted from the other app's sso.conf -
# same oauth2-proxy auth_request pattern, plus the identity headers this app reads.
#
#   browser -> nginx -> auth_request -> oauth2-proxy -> company identity provider
#                    -> Streamlit :8501 -> FastAPI :8000 (server to server; never via nginx)
#
# `frontend` and `oauth2-proxy` are docker-compose service names. Without docker use
# 127.0.0.1:8501 and 127.0.0.1:4180.
#
# SSO is only real while ALL of these hold:
#   * Streamlit (8501) and FastAPI (8000) cannot be reached from users' machines - bind them
#     to 127.0.0.1 or leave the docker ports unpublished. Whoever reaches 8501 directly can
#     send an X-Auth-Request-Email of their choosing.
#   * Streamlit runs with --server.baseUrlPath=unisonic, matching the location below.
#   * oauth2-proxy runs with set_xauthrequest = true (see oauth2-proxy.cfg.example).

server {
    listen 80;
    server_name _;

    location = / {
        return 302 /unisonic/;
    }

    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
    }

    location = /oauth2/auth {
        proxy_pass http://oauth2-proxy:4180/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /unisonic/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        # What oauth2-proxy answered about this request.
        auth_request_set $authorization $upstream_http_authorization;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        auth_request_set $sso_email $upstream_http_x_auth_request_email;
        auth_request_set $sso_user $upstream_http_x_auth_request_user;
        auth_request_set $sso_username $upstream_http_x_auth_request_preferred_username;
        add_header Set-Cookie $auth_cookie always;

        # The four headers backend/core/sso.py trusts. Setting one here REPLACES anything the
        # browser sent under that name (an empty value drops it), so nobody can type their
        # own identity. Do not remove a line without removing the header from sso.py too.
        proxy_set_header Authorization $authorization;
        proxy_set_header X-Auth-Request-Email $sso_email;
        proxy_set_header X-Auth-Request-User $sso_user;
        proxy_set_header X-Auth-Request-Preferred-Username $sso_username;

        proxy_pass http://frontend:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A question takes 30-150s on a CPU-only host; the websocket must outlive it.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
